spring.application.name=kingdomjerseys-admin
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/kingdomjerseys?createDatabaseIfNotExist=true&serverTimezone=America/Hermosillo
spring.datasource.username=${DB_USUARIO:root}
