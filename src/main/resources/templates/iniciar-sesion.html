<!DOCTYPE html>
<th:block th:replace="~{layout/base :: layout(~{::title}, ~{::main}, null)}">
    <tilte>KingdomJerseys - Iniciar sesion</tilte>
    <main>
        <div class="auth-wrap">
            <div class="auth-panel">
                <div class="eyebrow">TU CUENTA</div>
                <h1>Bienvenido de vuelta.</h1>
                <p>Entra para ver tus pedidos y guardar tus camisetas favoritas.</p>
                <form action="#" method="post">
                    <div class="form-group">
                        <label for="correo">Correo</label>
                        <input type="email" id="correo" name="correo" placeholder="tu@ejemplo.com" required>
                    </div>
                    <div class="form-group">
                        <label for="contrasenia">Contraseña</label>
                        <input type="password" id="contrasenia" name="contrasenia" placeholder="••••••••" required>
                    </div>
                    <button class="btn btn-primary btn-full" type="submit">Iniciar sesion</button>
                </form>
                <p class="auth-foot">¿No tienes cuenta? <a href="/registro">Registrate</a></p>
            </div>
        </div>
    </main>
</th:block>
