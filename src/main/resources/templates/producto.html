<!--/*@thymesVar id="cantidad" type="java.lang.Integer"*/-->
<!DOCTYPE html>
<th:block th:replace="~{layout/base :: layout(~{::title}, ~{::contenido}, 'novedades')}">
  <title th:text="'KingdomJerseys — ' + ${producto.nombre}">KingdomJerseys — México · Selección</title>
  <th:block th:fragment="contenido">
    <main class="product" th:object="${producto}">
      <div class="product-grid">
        <div class="product-left">
          <img src="/imgs/mexico-local.jpg" alt="México · Selección"
               th:src="@{/imgs/{f}(f=*{imagenDetalle})}" th:alt="*{nombre}">
          <p class="product-copy" th:text="*{descripcion}">
            Descripción de la camiseta.
          </p>
          <p class="free-ship"><img class="ico" src="/imgs/iconos/truck-verde.svg" alt=""> ENVÍO GRATIS</p>
        </div>

        <div class="product-right">
          <h1 th:text="*{nombre}">México · Selección</h1>
          <p class="product-price" th:text="'$ ' + ${#numbers.formatInteger(producto.precio,1,'COMMA')}">$ 600</p>
          <form action="/carrito/agregar" method="post">
            <input type="hidden" name="id" th:value="*{id}">
            <!--/*@thymesVar id="cantidad" type="java.lang.Integer"*/-->
            <input type="hidden" name="cantidad" th:value="${cantidad}" value="1">
            <p class="qty-label">Cantidad</p>
            <div class="qty">
              <a href="/producto/argentina?cantidad=2" th:href="@{/producto/{id}(id=*{id},cantidad=${cantidad + 1})}" aria-label="Más">+</a>
              <span th:text="${cantidad}">1</span>
              <a href="/producto/argentina?cantidad=1" th:href="@{/producto/{id}(id=*{id},cantidad=${cantidad - 1})}" aria-label="Menos">-</a>
            </div>
            <button class="btn btn-primary btn-wide" type="submit">
              <img class="ico" src="/imgs/iconos/shopping-bag-blanco.svg" alt="">
              Añadir al carrito
            </button>
          </form>
          <ul class="product-details">
            <li th:text="'Material: ' + *{material}">Material: 100% Poliéster</li>
            <li th:text="'Ajuste: ' + *{ajuste}">Ajuste: Ceñido</li>
            <li th:text="'Color del artículo: ' + *{color}">Color del artículo: Verde intenso</li>
          </ul>
        </div>
      </div>
    </main>
    <th:block th:replace="~{fragments/beneficios :: beneficios}"></th:block>
  </th:block>
</th:block>
