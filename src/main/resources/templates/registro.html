<!DOCTYPE html>
<th:block th:replace="~{layout/base :: layout(~{::title}, ~{::main}, null)}">
  <title>KingdomJerseys — Crear cuenta</title>
  <main>
    <div class="auth-wrap">
      <div class="auth-panel">
        <div class="eyebrow">ÚNETE</div>
        <h1>Crea tu cuenta.</h1>
        <p>Guarda tus favoritas y compra más rápido.</p>
        <form action="#" method="post">
          <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" minlength="3" placeholder="Tu nombre" required>
          </div>
          <div class="form-group">
            <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo" placeholder="tú@ejemplo.com" required>
          </div>
          <div class="form-group">
            <label for="contrasenia">Contraseña</label>
            <input type="password" id="contrasenia" name="contrasenia" placeholder="Mínimo 6 caracteres" minlength="6" required>
          </div>
          <label class="form-check">
            <input type="checkbox" name="terminos" required>
            <span>Acepto los términos y condiciones</span>
          </label>
          <button class="btn btn-primary btn-full" type="submit">Crear cuenta</button>
        </form>
        <p class="auth-foot">¿Ya tienes cuenta? <a href="/iniciar-sesion">Inicia sesión</a></p>
      </div>
    </div>
  </main>
</th:block>
