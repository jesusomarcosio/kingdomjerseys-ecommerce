<!DOCTYPE html>
<th:block th:replace="~{layout/base :: layout(~{::title}, ~{::contenido}, 'novedades')}">
  <title>KingdomJerseys — Datos de envío</title>
  <th:block th:fragment="contenido">
    <main class="checkout">
      <section class="checkout-main">
        <ol class="steps">
          <li class="done"><a href="/carrito">Carrito</a></li>
          <li class="current"><a href="/datos">Datos</a></li>
          <li><a href="/envio">Envío</a></li>
          <li><a href="/pago">Pago</a></li>
        </ol>

        <div class="co-title">
          <h2>Contacto</h2>
          <p>¿Ya tienes cuenta? <a class="link-green" href="/iniciar-sesion">Iniciar sesión</a></p>
        </div>

        <form action="/envio" method="get">
          <input class="co-input" type="text" name="contacto" placeholder="Correo o teléfono celular" aria-label="Correo o teléfono celular" required>
          <h2 class="co-sub">Dirección de envío</h2>
          <div class="co-row">
            <input class="co-input" type="text" name="nombre" placeholder="Nombre" aria-label="Nombre" required>
            <input class="co-input" type="text" name="apellido" placeholder="Apellido" aria-label="Apellido" required>
          </div>
          <input class="co-input" type="text" name="direccion" placeholder="Calle y número" aria-label="Calle y número" required>
          <input class="co-input" type="text" name="nota" placeholder="Nota de envío (opcional)" aria-label="Nota de envío">
          <div class="co-row three">
            <input class="co-input" type="text" name="ciudad" placeholder="Ciudad" aria-label="Ciudad" required>
            <input class="co-input" type="text" name="cp" placeholder="Código postal" aria-label="Código postal" required>
            <select class="co-input" name="estado" aria-label="Estado" required>
              <option value="">Estado</option>
              <option>Sonora</option>
              <option>Sinaloa</option>
              <option>Chihuahua</option>
              <option>Jalisco</option>
              <option>Ciudad de México</option>
              <option>Nuevo León</option>
            </select>
          </div>
          <select class="co-input" name="pais" aria-label="País o región"><option>México</option></select>
          <label class="form-check">
            <input type="checkbox" name="guardar">
            <span>Guardar esta información para próximas compras</span>
          </label>
          <div class="co-actions">
            <a class="link-green" href="/carrito">Regresar al carrito</a>
            <button class="btn btn-primary" type="submit">Ir al envío</button>
          </div>
        </form>
      </section>

      <aside class="summary">
        <div class="sum-product" th:each="item : ${items}">
          <div class="sum-img">
            <img src="/imgs/mexico-local.jpg" alt="México · Selección"
                 th:src="@{/imgs/{f}(f=${item.producto.imagenDetalle})}" th:alt="${item.producto.nombre}">
            <span class="sum-badge" th:text="${item.cantidad}">1</span>
          </div>
          <div>
            <h3 th:text="${item.producto.nombre}">México · Selección</h3>
            <p class="sum-price" th:text="'$ ' + ${#numbers.formatInteger(item.total,1,'COMMA')}">$ 600</p>
          </div>
        </div>
        <form class="coupon" action="#" method="post">
          <input type="text" name="cupon" placeholder="Código de cupón" aria-label="Código de cupón">
          <button type="button">Añadir</button>
        </form>
        <dl class="sum-lines">
          <div>
            <dt>Subtotal</dt>
            <dd th:text="'$ ' + ${#numbers.formatInteger(subtotal,1,'COMMA')}">$ 600</dd>
          </div>
          <div>
            <dt>Envío</dt>
            <dd>Se calcula en el siguiente paso</dd>
          </div>
        </dl>
        <dl class="sum-total">
          <div>
            <dt>Total</dt>
            <dd th:text="'$ ' + ${#numbers.formatInteger(subtotal,1,'COMMA')}">$ 600</dd>
          </div>
        </dl>
      </aside>
    </main>
    <th:block th:replace="~{fragments/beneficios :: beneficios}"></th:block>
  </th:block>
</th:block>
