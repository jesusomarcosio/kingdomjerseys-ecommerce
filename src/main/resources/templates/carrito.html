<!DOCTYPE html>
<th:block th:replace="~{layout/base :: layout(~{::title}, ~{::contenido}, 'novedades')}">
  <title>KingdomJerseys — Tu carrito</title>
  <th:block th:fragment="contenido">
    <main class="cart">
      <h1>Tu carrito</h1>
      <a class="link-green" href="/novedades">Volver a comprar</a>
      <div class="cart-table">
        <div class="cart-head">
          <span>Producto</span>
          <span>Precio</span>
          <span>Cantidad</span>
          <span>Total</span>
        </div>
        <div class="cart-row" th:each="item : ${items}">
          <div class="cart-prod">
            <img src="/imgs/mexico-local.jpg" alt="México · Selección"
                 th:src="@{/imgs/{f}(f=${item.producto.imagenDetalle})}" th:alt="${item.producto.nombre}">
            <div>
              <h3><a th:href="@{/producto/{id}(id=${item.producto.id})}" th:text="${item.producto.nombre}">México · Selección</a></h3>
              <form action="/carrito/remover" method="post">
                <input type="hidden" name="id" th:value="${item.producto.id}">
                <button class="link-green link-btn" type="submit">Remover</button>
              </form>
            </div>
          </div>
          <span class="cart-price" th:text="'$ ' + ${#numbers.formatInteger(item.producto.precio,1,'COMMA')}">$ 600</span>
          <form class="qty-form" action="/carrito/cantidad" method="post">
            <input type="hidden" name="id" th:value="${item.producto.id}">
            <div class="qty">
              <button type="submit" name="delta" value="1" aria-label="Más">+</button>
              <span th:text="${item.cantidad}">1</span>
              <button type="submit" name="delta" value="-1" aria-label="Menos">-</button>
            </div>
          </form>
          <span class="cart-total" th:text="'$ ' + ${#numbers.formatInteger(item.total,1,'COMMA')}">$ 600</span>
        </div>
        <p class="cart-empty" th:if="${#lists.isEmpty(items)}">Tu carrito está vacío. Elige tu próxima camiseta en Novedades.</p>
      </div>

      <div class="cart-foot">
        <div class="cart-sub">
          <p><strong>Sub-total</strong><span th:text="'$ ' + ${#numbers.formatInteger(subtotal,1,'COMMA')}">$ 600</span></p>
          <small>Los costos de impuestos y envío se calcularán después.</small>
        </div>
        <a class="btn btn-primary" href="/datos" th:if="${!#lists.isEmpty(items)}">Finalizar compra</a>
      </div>
    </main>
    <th:block th:replace="~{fragments/beneficios :: beneficios}"></th:block>
  </th:block>
</th:block>
