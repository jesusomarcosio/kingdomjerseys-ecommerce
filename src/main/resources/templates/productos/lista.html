<!--/*@thymesVar id="productos" type="java.util.List<com.kingdomjerseys.admin.model.Producto>"*/-->
<!--/*@thymesVar id="q" type="java.lang.String"*/-->
<!DOCTYPE html>
<th:block th:replace="~{layout/base :: layout(~{::title}, ~{::main}, 'productos')}">
  <title>Productos | KingdomJerseys Admin</title>
  <main class="contenido">
    <div class="pagina-titulo">
      <div>
        <div class="eyebrow">CATÁLOGO</div>
        <h1>Productos</h1>
      </div>
      <a class="btn btn-primary" th:href="@{/admin/productos/nuevo}">
        <img th:src="@{/imgs/iconos/plus-blanco.svg}" alt="">
        Nuevo producto
      </a>
    </div>

    <section class="bloque">
      <form class="filtros" th:action="@{/admin/productos}" method="get">
        <div class="buscador">
          <img th:src="@{/imgs/iconos/search-ink.svg}" alt="">
          <input type="text" name="q" th:value="${q}" placeholder="Busca por nombre" autocomplete="off">
        </div>
        <button class="btn btn-outline btn-sm" type="submit">Buscar</button>
        <a class="btn btn-outline btn-sm" th:if="${q != null and !q.isBlank()}" th:href="@{/admin/productos}">Limpiar</a>
      </form>

      <div class="tabla-wrap">
        <table>
          <thead>
            <tr>
              <th>Producto</th>
              <th>Categoría</th>
              <th class="num">Precio</th>
              <th class="num">Stock</th>
              <th>Estado</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="producto : ${productos}">
              <td>
                <div class="celda-producto">
                  <img class="miniatura" th:if="${producto.imagen != null and !producto.imagen.isBlank()}"
                       th:src="@{${producto.imagen}}" th:alt="${producto.nombre}">
                  <span class="miniatura" th:unless="${producto.imagen != null and !producto.imagen.isBlank()}"></span>
                  <div>
                    <span th:text="${producto.nombre}">Producto</span>
                    <small th:if="${producto.etiqueta != null and !producto.etiqueta.isBlank()}" th:text="${producto.etiqueta}">NUEVA</small>
                  </div>
                </div>
              </td>
              <td th:text="${producto.categoria}">Clubes</td>
              <td class="num" th:text="'$' + ${#numbers.formatDecimal(producto.precio, 1, 'COMMA', 2, 'POINT')}">$600.00</td>
              <td class="num" th:text="${producto.stock}" th:classappend="${producto.stock <= 5} ? 'stock-bajo'">10</td>
              <td>
                <span class="insignia" th:classappend="${producto.activo} ? 'insignia-activo' : 'insignia-inactivo'"
                      th:text="${producto.activo} ? 'Activo' : 'Inactivo'">Activo</span>
              </td>
              <td>
                <div class="acciones">
                  <a class="btn btn-outline btn-sm" th:href="@{/admin/productos/{id}/editar(id=${producto.id})}">Editar</a>
                  <details class="confirmar">
                    <summary class="btn btn-peligro btn-sm">Eliminar</summary>
                    <form class="confirmar-caja" th:action="@{/admin/productos/{id}/eliminar(id=${producto.id})}" method="post">
                      <p>¿Seguro que quieres eliminarlo?</p>
                      <button class="btn btn-peligro btn-sm" type="submit">Sí, eliminar</button>
                    </form>
                  </details>
                </div>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(productos)}">
              <td colspan="6" class="vacio">No hay productos que coincidan.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</th:block>
