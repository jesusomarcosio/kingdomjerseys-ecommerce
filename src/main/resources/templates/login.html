<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso | KingdomJerseys Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" th:href="@{/imgs/logo-corona.svg}" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
  </head>
  <body>
    <main class="login">
      <div class="login-caja">
        <div class="login-marca">
          <img th:src="@{/imgs/logo-corona.svg}" alt="">
          <span>KINGDOMJERSEYS</span>
        </div>

        <h1>Panel de administración</h1>
        <p class="lead">Inicia sesión con tu cuenta de administrador.</p>

        <p class="alerta alerta-error alerta-form" th:if="${param.error}">
          Correo o contraseña incorrectos, o la cuenta está desactivada.
        </p>
        <p class="alerta alerta-exito alerta-form" th:if="${param.salio}">
          Cerraste sesión correctamente.
        </p>

        <form th:action="@{/admin/login}" method="post">
          <div class="campo">
            <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo" placeholder="admin@kingdomjerseys.com" required autofocus>
          </div>

          <div class="campo">
            <label for="contrasenia">Contraseña</label>
            <input type="password" id="contrasenia" name="contrasenia" placeholder="••••••••" required>
          </div>

          <button class="btn btn-primary" type="submit">Iniciar sesión</button>
        </form>
      </div>
    </main>
  </body>
</html>
