<!--/*@thymesVar id="mensaje" type="java.lang.String"*/-->
<!--/*@thymesVar id="error" type="java.lang.String"*/-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" th:fragment="layout(title, content, seccion)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:replace="${title}">Panel | KingdomJerseys</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" th:href="@{/imgs/logo-corona.svg}" type="image/svg+xml">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="panel">
  <aside th:replace="~{fragments/menu-lateral :: menu(${seccion})}"></aside>

  <div class="panel-main">
    <header th:replace="~{fragments/cabecera :: cabecera}"></header>

    <div class="alertas" th:if="${mensaje != null or error != null}">
      <p class="alerta alerta-exito" th:if="${mensaje != null}" th:text="${mensaje}">Operación realizada</p>
      <p class="alerta alerta-error" th:if="${error != null}" th:text="${error}">Algo salió mal</p>
    </div>

    <th:block th:replace="${content}"></th:block>
  </div>
</div>
</body>
</html>
